server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Mesma origem do SPA: sem CORS. "securebank-api" é o nome do serviço no compose.
    location /api/ {
        proxy_pass http://securebank-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 1y;  # expires (não add_header) para não anular os headers de segurança herdados
    }

    # SPA: rotas do React Router caem no index.html
    location / {
        try_files $uri /index.html;
        expires -1;
    }
}
