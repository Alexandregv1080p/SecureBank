# MODELO: todos os valores abaixo são placeholders e NÃO devem ser usados como estão.
# Não se versiona segredo real. Crie o real direto no cluster (ver docs/devops/kubernetes.md):
#
#   kubectl -n securebank create secret generic securebank-secrets \
#     --from-literal=DB_PASSWORD="$(openssl rand -base64 24)" \
#     --from-literal=REDIS_PASSWORD="$(openssl rand -base64 24)" \
#     --from-literal=MFA_ENCRYPTION_KEY="$(openssl rand -base64 32)" \
#     --from-file=JWT_PRIVATE_KEY=jwt-private.pem --from-file=JWT_PUBLIC_KEY=jwt-public.pem \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# Em produção o valor vem do AWS Secrets Manager (External Secrets / CSI driver; Fase 12).
#
# JWT_PRIVATE_KEY/JWT_PUBLIC_KEY são OBRIGATÓRIAS com mais de uma réplica: sem elas cada pod gera um par efêmero
# e um token assinado por um pod é rejeitado pelos outros. Por isso o secret.yaml NÃO entra no kustomization.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: securebank-secrets
  namespace: securebank
  labels:
    app.kubernetes.io/part-of: securebank
type: Opaque
stringData:
  DB_PASSWORD: CHANGE_ME
  REDIS_PASSWORD: CHANGE_ME
  MFA_ENCRYPTION_KEY: CHANGE_ME
  JWT_PRIVATE_KEY: CHANGE_ME
  JWT_PUBLIC_KEY: CHANGE_ME
