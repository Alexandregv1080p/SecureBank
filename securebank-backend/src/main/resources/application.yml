spring:
  application:
    name: securebank-api
  # Dev local: lê ../.env (o mesmo do compose). Em container/produção o arquivo não existe e o ambiente manda.
  config:
    import: optional:file:../.env[.properties]
  # Segredos só via ambiente (.env no dev, Secrets Manager em produção). Sem default de senha.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5439/securebank}
    username: ${DB_USER:securebank}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 3000   # banco fora: falha em 3 s com 503, não pendura a requisição por 30 s
  data:
    redis:
      client-type: jedis
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all                       # só confirma quando todas as réplicas em sincronia gravaram
      properties:
        enable.idempotence: true      # retry do produtor não duplica mensagem
        request.timeout.ms: 5000
        delivery.timeout.ms: 15000   # >= request.timeout + linger
    consumer:
      group-id: securebank-notifications
      auto-offset-reset: earliest
      enable-auto-commit: false
    # o traceId viaja nos headers da mensagem: o consumidor continua o mesmo trace da requisição que gerou o evento
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
      ack-mode: record               # offset só avança depois de processar (e gravar) cada mensagem
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway é o dono do schema; JPA só valida
    open-in-view: false
    properties:
      # UPDATEs em ordem de chave primária: transferências em sentidos opostos travam as linhas na mesma ordem (sem deadlock)
      hibernate.order_updates: true
  flyway:
    enabled: true

# Documentação da API (Swagger UI) desligada por padrão; ligue com API_DOCS_ENABLED=true (só dev).
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}

# Autenticação e segurança. Segredos só por ambiente; os padrões seguem a seção 17 (access 15 min, refresh rotativo).
securebank:
  auth:
    issuer: securebank
    audience: securebank-api
  security:
    mfa-encryption-key: ${MFA_ENCRYPTION_KEY:}   # obrigatória: AES-256 em Base64 (openssl rand -base64 32)
    jwt:
      private-key: ${JWT_PRIVATE_KEY:}           # PEM PKCS#8; vazio = par efêmero (só dev)
      public-key: ${JWT_PUBLIC_KEY:}
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}       # cria o 1º ADMIN se informado
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  ratelimit:
    enabled: true
  kafka:
    enabled: true                    # false = eventos só no log (sem broker)
    topic-replicas: ${KAFKA_TOPIC_REPLICAS:1}   # 1 = broker único; 3 no MSK

server:
  # Atrás do nginx: o IP real vem do X-Forwarded-For (Tomcat só confia em proxies de rede privada).
  forward-headers-strategy: native
  # Erros nunca vazam stack trace nem mensagem interna para o cliente.
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
  shutdown: graceful

management:
  # Porta própria (não publicada no host nem roteada pelo nginx): só o Prometheus, dentro da rede, a alcança.
  server:
    port: ${MANAGEMENT_PORT:9090}
  endpoints:
    web:
      base-path: /api/v1/actuator
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      # sem banco a API não atende nada: sai do balanceamento (readiness) mas NÃO é reiniciada (liveness não inclui o banco)
      group:
        readiness:
          include: readinessState,db
      show-details: never
  metrics:
    tags:
      application: securebank-api
    distribution:
      percentiles-histogram:
        http.server.requests: true
  # Traces: 100% amostrados (dev); em produção reduzir. Só exporta se TRACING_EXPORT=true (Jaeger no compose de observabilidade).
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
    export:
      enabled: ${TRACING_EXPORT:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
          transport: http
  otlp:
    metrics:
      export:
        enabled: false   # métricas vão por scrape do Prometheus, não por push

logging:
  structured:
    json:
      add:
        service: securebank-api
