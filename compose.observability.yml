# Observabilidade (logs, métricas, traces, alertas). Sobrepõe o compose.yml:
#   docker compose -f compose.yml -f compose.observability.yml up -d
# Grafana http://localhost:3600 · Prometheus http://localhost:9190 · Jaeger http://localhost:16686
name: securebank

services:
  securebank-api:
    environment:
      TRACING_EXPORT: "true"
      OTEL_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      jaeger:
        condition: service_started

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9190}:9090"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # All-in-one com armazenamento em memória: dev. Em produção, backend persistente (Fase 12).
  jaeger:
    image: jaegertracing/jaeger:2.11.0
    ports:
      - "127.0.0.1:${JAEGER_PORT:-16686}:16686"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  loki:
    image: grafana/loki:3.5.5
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - lokidata:/loki
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Lê os logs dos containers pelo socket do Docker (somente leitura). Só para dev: em Kubernetes lê dos pods (Fase 11).
  alloy:
    image: grafana/alloy:v1.11.0
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?defina GRAFANA_PASSWORD no .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3600}:3000"
    depends_on:
      - prometheus
      - loki
      - jaeger
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  promdata:
  lokidata:
  grafanadata:
