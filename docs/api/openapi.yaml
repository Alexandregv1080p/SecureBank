openapi: 3.1.0
info:
  title: SecureBank Core Banking API
  description: "Autenticação (JWT, refresh com rotação, MFA TOTP), clientes, contas,\
    \ depósitos, saques, transferências, pagamentos, extrato, limites, auditoria e\
    \ administração. Valores monetários trafegam como string (\"100.00\"). Transferê\
    ncias e pagamentos exigem o header Idempotency-Key."
  version: v1
servers:
- url: http://localhost:8100
  description: Generated server url
security:
- bearerAuth: []
paths:
  /api/v1/admin/accounts/{accountId}/limits/{type}:
    put:
      tags:
      - admin-controller
      operationId: changeLimit
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
      - name: type
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LimitRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LimitView"
  /api/v1/transfers:
    get:
      tags:
      - transfer-controller
      operationId: list
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TransferPage"
    post:
      tags:
      - transfer-controller
      operationId: create
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TransferResponse"
  /api/v1/security/password:
    post:
      tags:
      - security-controller
      operationId: changePassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
        required: true
      responses:
        "204":
          description: No Content
  /api/v1/security/mfa:
    get:
      tags:
      - security-controller
      operationId: mfaStatus
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MfaStatusResponse"
    post:
      tags:
      - security-controller
      operationId: setupMfa
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MfaSetupResponse"
    delete:
      tags:
      - security-controller
      operationId: disableMfa
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeRequest"
        required: true
      responses:
        "204":
          description: No Content
  /api/v1/security/mfa/confirm:
    post:
      tags:
      - security-controller
      operationId: confirmMfa
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeRequest"
        required: true
      responses:
        "204":
          description: No Content
  /api/v1/payments:
    get:
      tags:
      - payment-controller
      operationId: list_1
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PaymentPage"
    post:
      tags:
      - payment-controller
      operationId: create_1
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PaymentResponse"
  /api/v1/notifications/{id}/read:
    post:
      tags:
      - notification-controller
      operationId: read
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
  /api/v1/auth/register:
    post:
      tags:
      - auth-controller
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RegisterResponse"
  /api/v1/auth/refresh:
    post:
      tags:
      - auth-controller
      operationId: refresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TokenResponse"
  /api/v1/auth/mfa/verify:
    post:
      tags:
      - auth-controller
      operationId: verifyMfa
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaVerifyRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TokenResponse"
  /api/v1/auth/logout:
    post:
      tags:
      - auth-controller
      operationId: logout
      responses:
        "204":
          description: No Content
  /api/v1/auth/login:
    post:
      tags:
      - auth-controller
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TokenResponse"
  /api/v1/admin/users:
    post:
      tags:
      - admin-controller
      operationId: createUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserView"
  /api/v1/admin/users/{id}/enable:
    post:
      tags:
      - admin-controller
      operationId: enableUser
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
  /api/v1/admin/users/{id}/disable:
    post:
      tags:
      - admin-controller
      operationId: disableUser
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
  /api/v1/admin/accounts/{id}/unblock:
    post:
      tags:
      - admin-controller
      operationId: unblock
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AccountStatusView"
  /api/v1/admin/accounts/{id}/block:
    post:
      tags:
      - admin-controller
      operationId: block
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AccountStatusView"
  /api/v1/accounts:
    get:
      tags:
      - account-controller
      operationId: list_2
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccountResponse"
    post:
      tags:
      - account-controller
      operationId: open
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenAccountRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AccountResponse"
  /api/v1/accounts/{id}/withdrawals:
    post:
      tags:
      - account-controller
      operationId: withdraw
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AmountRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TransactionResponse"
  /api/v1/accounts/{id}/deposits:
    post:
      tags:
      - account-controller
      operationId: deposit
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AmountRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TransactionResponse"
  /api/v1/customers/me:
    get:
      tags:
      - customer-controller
      operationId: me
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CustomerResponse"
    patch:
      tags:
      - customer-controller
      operationId: updateMe
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CustomerResponse"
  /api/v1/transfers/{id}:
    get:
      tags:
      - transfer-controller
      operationId: get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TransferResponse"
  /api/v1/security/sessions:
    get:
      tags:
      - security-controller
      operationId: sessions
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionResponse"
  /api/v1/payments/{id}:
    get:
      tags:
      - payment-controller
      operationId: get_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PaymentResponse"
  /api/v1/notifications:
    get:
      tags:
      - notification-controller
      operationId: list_3
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/NotificationPage"
  /api/v1/audit:
    get:
      tags:
      - audit-controller
      operationId: search
      parameters:
      - name: event
        in: query
        required: false
        schema:
          type: string
          enum:
          - USER_REGISTERED
          - LOGIN_SUCCESS
          - LOGIN_FAILED
          - LOGOUT
          - SESSION_REVOKED
          - REFRESH_TOKEN_REUSE_DETECTED
          - PASSWORD_CHANGED
          - MFA_ENABLED
          - MFA_DISABLED
          - MFA_FAILED
          - TRANSFER_CREATED
          - TRANSFER_FAILED
          - PAYMENT_CREATED
          - PAYMENT_FAILED
          - ACCOUNT_BLOCKED
          - ACCOUNT_UNBLOCKED
          - LIMIT_CHANGED
          - USER_CREATED
          - USER_DISABLED
          - USER_ENABLED
          - ACCESS_DENIED
      - name: userId
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuditPage"
  /api/v1/admin/customers/{id}:
    get:
      tags:
      - admin-controller
      operationId: customer
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CustomerView"
  /api/v1/accounts/{id}:
    get:
      tags:
      - account-controller
      operationId: get_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AccountResponse"
  /api/v1/accounts/{id}/statement:
    get:
      tags:
      - account-controller
      operationId: statement
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StatementResponse"
  /api/v1/accounts/{id}/limits:
    get:
      tags:
      - account-controller
      operationId: limits
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LimitResponse"
  /api/v1/accounts/{id}/balance:
    get:
      tags:
      - account-controller
      operationId: balance
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BalanceResponse"
  /.well-known/jwks.json:
    get:
      tags:
      - jwks-controller
      operationId: jwks
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties: {}
  /api/v1/security/sessions/{id}:
    delete:
      tags:
      - security-controller
      operationId: revokeSession
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
components:
  schemas:
    LimitRequest:
      type: object
      properties:
        perOperation:
          type: number
          minimum: 0.01
        daily:
          type: number
          minimum: 0.01
      required:
      - daily
      - perOperation
    LimitView:
      type: object
      properties:
        type:
          type: string
        perOperation:
          $ref: "#/components/schemas/MoneyResponse"
        daily:
          $ref: "#/components/schemas/MoneyResponse"
    MoneyResponse:
      type: object
      properties:
        amount:
          type: string
        currency:
          type: string
    TransferRequest:
      type: object
      properties:
        sourceAccountId:
          type: string
          format: uuid
        destinationBranch:
          type: string
          maxLength: 4
          minLength: 0
        destinationAccountNumber:
          type: string
          maxLength: 14
          minLength: 0
        amount:
          type: number
          minimum: 0.01
        description:
          type: string
          maxLength: 140
          minLength: 0
      required:
      - amount
      - destinationAccountNumber
      - destinationBranch
      - sourceAccountId
    TransferResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sourceAccountId:
          type: string
          format: uuid
        destinationAccountId:
          type: string
          format: uuid
        amount:
          $ref: "#/components/schemas/MoneyResponse"
        description:
          type: string
        status:
          type: string
        debitTransactionId:
          type: string
          format: uuid
        creditTransactionId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
    ChangePasswordRequest:
      type: object
      properties:
        currentPassword:
          type: string
          maxLength: 128
          minLength: 0
        newPassword:
          type: string
          maxLength: 128
          minLength: 0
      required:
      - currentPassword
      - newPassword
    MfaSetupResponse:
      type: object
      properties:
        secret:
          type: string
        otpauthUri:
          type: string
    CodeRequest:
      type: object
      properties:
        code:
          type: string
          maxLength: 6
          minLength: 6
      required:
      - code
    PaymentRequest:
      type: object
      properties:
        accountId:
          type: string
          format: uuid
        amount:
          type: number
          minimum: 0.01
        barcode:
          type: string
          maxLength: 48
          minLength: 0
        description:
          type: string
          maxLength: 140
          minLength: 0
      required:
      - accountId
      - amount
      - barcode
    PaymentResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        amount:
          $ref: "#/components/schemas/MoneyResponse"
        barcode:
          type: string
        description:
          type: string
        status:
          type: string
        transactionId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
    RegisterRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 0
        document:
          type: string
          maxLength: 14
          minLength: 0
        email:
          type: string
          maxLength: 254
          minLength: 0
        phone:
          type: string
          maxLength: 16
          minLength: 0
        password:
          type: string
          maxLength: 128
          minLength: 0
      required:
      - document
      - email
      - name
      - password
      - phone
    RegisterResponse:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        email:
          type: string
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
          maxLength: 200
          minLength: 0
    TokenResponse:
      type: object
      properties:
        mfaRequired:
          type: boolean
        mfaToken:
          type: string
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
        expiresIn:
          type: integer
          format: int64
    MfaVerifyRequest:
      type: object
      properties:
        mfaToken:
          type: string
          maxLength: 2000
          minLength: 0
        code:
          type: string
          maxLength: 6
          minLength: 6
      required:
      - code
      - mfaToken
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          maxLength: 254
          minLength: 0
        password:
          type: string
          maxLength: 128
          minLength: 0
      required:
      - email
      - password
    CreateUserRequest:
      type: object
      properties:
        email:
          type: string
          maxLength: 254
          minLength: 0
        password:
          type: string
          maxLength: 128
          minLength: 0
        role:
          type: string
          enum:
          - CUSTOMER
          - SUPPORT
          - ADMIN
      required:
      - email
      - password
      - role
    UserView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
        status:
          type: string
    AccountStatusView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
    OpenAccountRequest:
      type: object
      properties:
        type:
          type: string
          enum:
          - CHECKING
          - SAVINGS
      required:
      - type
    AccountResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        branch:
          type: string
        accountNumber:
          type: string
        type:
          type: string
        status:
          type: string
        balance:
          $ref: "#/components/schemas/MoneyResponse"
        createdAt:
          type: string
          format: date-time
    AmountRequest:
      type: object
      properties:
        amount:
          type: number
          minimum: 0.01
      required:
      - amount
    TransactionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        type:
          type: string
        direction:
          type: string
        amount:
          $ref: "#/components/schemas/MoneyResponse"
        balanceAfter:
          $ref: "#/components/schemas/MoneyResponse"
        status:
          type: string
        reference:
          type: string
        createdAt:
          type: string
          format: date-time
    UpdateRequest:
      type: object
      properties:
        email:
          type: string
          maxLength: 254
          minLength: 0
        phone:
          type: string
          maxLength: 16
          minLength: 0
    CustomerResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        document:
          type: string
        email:
          type: string
        phone:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
    TransferPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TransferResponse"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
    SessionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        ip:
          type: string
        userAgent:
          type: string
        mfaVerified:
          type: boolean
        current:
          type: boolean
    MfaStatusResponse:
      type: object
      properties:
        enabled:
          type: boolean
    PaymentPage:
