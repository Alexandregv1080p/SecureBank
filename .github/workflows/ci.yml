name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: securebank-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # unitários (surefire) + integração (failsafe, Testcontainers no Docker do runner) + gate de cobertura (JaCoCo)
      - run: ./mvnw -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-reports
          path: |
            securebank-backend/target/site/jacoco
            securebank-backend/target/surefire-reports
            securebank-backend/target/failsafe-reports

  mutation:
    # Teste de mutação do domínio: mede se os testes realmente pegam regras quebradas (limite mínimo: 85%)
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: securebank-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B -Ppitest test-compile org.pitest:pitest-maven:mutationCoverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: securebank-backend/target/pit-reports

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: securebank-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: securebank-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
