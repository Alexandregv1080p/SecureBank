name: Dependency-Check

# OWASP Dependency-Check (base NVD) como segunda opinião ao Trivy do CI. É lento, então roda toda semana e sob demanda.
# Sem NVD_API_KEY (secret do repositório) o download da base NVD é muito lento: cadastre uma chave em nvd.nist.gov/developers.
on:
  schedule:
    - cron: '41 5 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: securebank-backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Dependency-Check (falha com CVSS >= 7)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >
          ./mvnw -B org.owasp:dependency-check-maven:13.0.0:check
          -DfailBuildOnCVSS=7 -DnvdApiKey="$NVD_API_KEY" -Dformats=HTML,SARIF
          -DsuppressionFiles=dependency-check-suppressions.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-check-report
          path: securebank-backend/target/dependency-check-report.*
