# Propriedades só de teste (segredos descartáveis; os reais vêm do ambiente).
securebank.security.mfa-encryption-key=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
securebank.bootstrap.admin-email=admin@securebank.test
securebank.bootstrap.admin-password=Bootstrap-Test-Pass-2026!

# O rate limit por requisição fica folgado para não atrapalhar a suíte (todos os testes vêm do mesmo IP);
# RateLimitTest sobrescreve estes valores.
securebank.ratelimit.login-per-minute-ip=100000
securebank.ratelimit.register-per-hour-ip=100000
securebank.ratelimit.mfa-per-minute-ip=100000
securebank.ratelimit.refresh-per-minute-ip=100000
securebank.ratelimit.money-per-minute-user=100000

securebank.outbox.enabled=false

securebank.kafka.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.kafka.autoconfigure.KafkaAutoConfiguration

# Management em porta aleatória própria (como em produção); os testes a leem com @LocalManagementPort
management.server.port=0
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:1/v1/traces

# o agendador do Pix agendado roda só quando o teste chama executeDue()
securebank.pix.scheduler.enabled=false
securebank.investment.scheduler.enabled=false
