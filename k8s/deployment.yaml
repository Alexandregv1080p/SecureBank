# Rolling update sem indisponibilidade: sobe um pod novo e só derruba um velho depois de o novo ficar Ready.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: securebank-api
  namespace: securebank
  labels: {app.kubernetes.io/name: securebank-api, app.kubernetes.io/part-of: securebank}
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app.kubernetes.io/name: securebank-api}
  template:
    metadata:
      labels: {app.kubernetes.io/name: securebank-api, app.kubernetes.io/part-of: securebank}
    spec:
      serviceAccountName: securebank-api
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 45   # > server.shutdown=graceful (30s): termina as requisições em andamento
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:          # réplicas em nós diferentes: um nó caindo não derruba a API
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: securebank-api}
      containers:
        - name: api
          image: ghcr.io/alexandregv1080p/securebank-backend:latest   # o kustomization.yaml fixa a tag (sha-...)
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
            - {name: management, containerPort: 9090}
          envFrom:
            - configMapRef: {name: securebank-api-config}
            - secretRef: {name: securebank-secrets}
          resources:
            requests: {cpu: 500m, memory: 768Mi}
            limits: {memory: 1Gi}            # sem limite de CPU: evita throttling; o HPA escala pelo request
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
          # A porta de management (9090) só é alcançada por kubelet e Prometheus; nunca pelo Ingress.
          startupProbe:                      # tolera a subida lenta (Flyway, Kafka) sem o liveness matar o pod
            httpGet: {path: /api/v1/actuator/health/readiness, port: management}
            periodSeconds: 5
            failureThreshold: 36             # até 3 min
          readinessProbe:                    # fora do Service enquanto banco/Redis/Kafka não respondem
            httpGet: {path: /api/v1/actuator/health/readiness, port: management}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:                     # reinicia só se a JVM travou (não depende de banco)
            httpGet: {path: /api/v1/actuator/health/liveness, port: management}
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:                         # dá tempo ao Service/Ingress de tirar o pod antes de ele parar de aceitar
              exec: {command: ["sleep", "10"]}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: securebank-web
  namespace: securebank
  labels: {app.kubernetes.io/name: securebank-web, app.kubernetes.io/part-of: securebank}
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app.kubernetes.io/name: securebank-web}
  template:
    metadata:
      labels: {app.kubernetes.io/name: securebank-web, app.kubernetes.io/part-of: securebank}
    spec:
      serviceAccountName: securebank-web
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: securebank-web}
      containers:
        - name: web
          image: ghcr.io/alexandregv1080p/securebank-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:                      # nginx-unprivileged grava pid e caches em /tmp
            - {name: tmp, mountPath: /tmp}
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 32Mi}
