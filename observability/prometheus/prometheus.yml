global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: securebank-api
    metrics_path: /api/v1/actuator/prometheus
    static_configs:
      - targets: ['securebank-api:9090']   # porta de management: só existe dentro da rede do compose
