name: CI

# Pipeline (seção 38): build → testes unitários e de integração → análise estática (CodeQL, workflow à parte) →
# scan de dependências e de segredos → build da imagem → scan da imagem → publicação no registry.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: securebank-backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # unitários (surefire) + integração (failsafe, Testcontainers no Docker do runner) + gate de cobertura (JaCoCo)
      - run: ./mvnw -B verify
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-reports
          path: |
            securebank-backend/target/site/jacoco
            securebank-backend/target/surefire-reports
            securebank-backend/target/failsafe-reports

  mutation:
    # Teste de mutação do domínio: mede se os testes realmente pegam regras quebradas (limite mínimo: 85%)
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: securebank-backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B -Ppitest test-compile org.pitest:pitest-maven:mutationCoverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-report
          path: securebank-backend/target/pit-reports

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: securebank-web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: securebank-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # dependências de produção com vulnerabilidade conhecida de severidade alta ou crítica quebram o build
      - run: npm audit --omit=dev --audit-level=high

  secrets:
    # Varredura de segredos em todo o histórico. Falso positivo conhecido: .env.example (placeholders), ver .gitleaks.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  kubernetes:
    # Os manifestos têm de renderizar e passar no esquema da API do Kubernetes (o Trivy, no job dependencies, cuida da segurança)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Renderizar (kustomize) e validar (kubeconform)
        run: |
          mkdir -p "$RUNNER_TEMP/k8s"
          kubectl kustomize k8s > "$RUNNER_TEMP/k8s/app.yaml"
          kubectl kustomize k8s/dependencies > "$RUNNER_TEMP/k8s/dependencies.yaml"
          docker run --rm -v "$RUNNER_TEMP/k8s:/m:ro" ghcr.io/yannh/kubeconform:v0.7.0 \
            -strict -summary -kubernetes-version 1.31.0 /m/app.yaml /m/dependencies.yaml

  terraform:
    # Formato, sintaxe e coerência dos três ambientes. Sem credenciais AWS: nunca faz plan nem apply (isso é manual).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
      - run: terraform fmt -recursive -check terraform
      - name: Validar cada ambiente
        run: |
          for env in dev staging production; do
            (cd terraform/environments/$env && terraform init -backend=false -input=false && terraform validate)
          done

  dependencies:
    # Trivy no repositório: vulnerabilidades em pom.xml / package-lock.json, segredos e má configuração (Dockerfile, compose)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          skip-dirs: node_modules,target,securebank-web/dist
          exit-code: '1'
          format: sarif
          output: trivy-fs.sarif
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  docker:
    # Build das imagens → scan (falha com HIGH/CRITICAL corrigível) → publicação no GHCR só em main/tags
    needs: [backend, web, secrets, dependencies, kubernetes]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: securebank-backend
          - name: web
            context: securebank-web
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
      - name: Nome da imagem em minúsculas (exigência do GHCR)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/securebank-${{ matrix.name }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
      - name: Build local para escanear
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          load: true
          push: false
          tags: scan/${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
      - name: Scan da imagem (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scan/${{ matrix.name }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: sarif
          output: trivy-image-${{ matrix.name }}.sarif
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-image-${{ matrix.name }}.sarif
          category: trivy-image-${{ matrix.name }}
      - uses: docker/login-action@v4
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publica (imagem imutável por commit, com SBOM e proveniência)
        id: push
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.name }}
      - uses: actions/attest-build-provenance@v4
        if: env.PUSH == 'true'
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
