# SOMENTE DESENVOLVIMENTO/DEMONSTRAÇÃO: uma instância de cada, sem alta disponibilidade nem backup.
# Em produção (Fase 12) isto some e a ConfigMap aponta para RDS (PostgreSQL), ElastiCache (Redis) e MSK (Kafka).
# Os pods obedecem ao Pod Security "restricted" do namespace (non-root, sem capabilities, seccomp). O sistema de
# arquivos fica gravável porque as imagens oficiais escrevem fora dos volumes.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: securebank
  labels: {app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: securebank}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: postgres}
  ports: [{name: pg, port: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: securebank
  labels: {app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: securebank}
spec:
  serviceName: postgres
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: postgres}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: securebank}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70            # usuário "postgres" da imagem alpine
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{name: pg, containerPort: 5432}]
          env:
            - {name: POSTGRES_DB, value: securebank}
            - name: POSTGRES_USER
              valueFrom: {configMapKeyRef: {name: securebank-api-config, key: DB_USER}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: securebank-secrets, key: DB_PASSWORD}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          resources:
            requests: {cpu: 200m, memory: 256Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
          readinessProbe:
            exec: {command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d securebank"]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d securebank"]}
            periodSeconds: 20
            failureThreshold: 6
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 5Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: securebank
  labels: {app.kubernetes.io/name: redis, app.kubernetes.io/part-of: securebank}
spec:
  selector: {app.kubernetes.io/name: redis}
  ports: [{name: redis, port: 6379}]
---
# Redis guarda só estado descartável (sessões revogadas, contadores de rate limit): sem persistência.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: securebank
  labels: {app.kubernetes.io/name: redis, app.kubernetes.io/part-of: securebank}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: redis}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: redis, app.kubernetes.io/part-of: securebank}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["sh", "-c", "exec redis-server --requirepass \"$REDIS_PASSWORD\" --save '' --appendonly no"]
          ports: [{name: redis, containerPort: 6379}]
          env:
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: securebank-secrets, key: REDIS_PASSWORD}}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            exec: {command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: redis}
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: securebank
  labels: {app.kubernetes.io/name: kafka, app.kubernetes.io/part-of: securebank}
spec:
  clusterIP: None
  publishNotReadyAddresses: true   # o broker precisa resolver o próprio nome antes de ficar Ready (KRaft)
  selector: {app.kubernetes.io/name: kafka}
  ports:
    - {name: internal, port: 19092}
    - {name: controller, port: 9093}
---
# Broker único em KRaft (sem ZooKeeper), PLAINTEXT: só dentro do namespace, protegido por NetworkPolicy.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: securebank
  labels: {app.kubernetes.io/name: kafka, app.kubernetes.io/part-of: securebank}
spec:
  serviceName: kafka
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: kafka}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: kafka, app.kubernetes.io/part-of: securebank}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false        # senão o k8s injeta KAFKA_PORT=tcp://... e quebra a imagem
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: kafka
          image: apache/kafka:4.1.1
          ports:
            - {name: internal, containerPort: 19092}
            - {name: controller, containerPort: 9093}
          env:
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_LISTENERS, value: "INTERNAL://:19092,CONTROLLER://:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "INTERNAL://kafka:19092"}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: INTERNAL}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@kafka:9093"}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0"}
            - {name: KAFKA_HEAP_OPTS, value: "-Xmx512m -Xms512m"}
          resources:
            requests: {cpu: 250m, memory: 768Mi}
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/kafka/data}
          readinessProbe:
            tcpSocket: {port: internal}
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            tcpSocket: {port: internal}
            periodSeconds: 20
            failureThreshold: 6
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 5Gi}}
